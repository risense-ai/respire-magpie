name: Community compatibility
on:
  workflow_dispatch:
    inputs:
      community_ref:
        description: Exact luodaoyi/plugins contribution commit to check
        required: true
        type: string
permissions:
  contents: read
jobs:
  community:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: luodaoyi/plugins
          ref: ${{ inputs.community_ref }}
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
      - name: Full community suite with isolated HOME
        run: HOME=$(mktemp -d) bun test
      - name: Community package checks
        run: bun scripts/check.mjs
      - name: Package contents
        working-directory: packages/respire-memory
        run: npm pack --dry-run
